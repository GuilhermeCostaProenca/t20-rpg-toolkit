<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>T20 OS — Cockpit de Campanha</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:#06070c; --fg:#f4efe7; --red:#bc4a3f; --gold:#d5a240; --muted:#b5aea4;
    --border:rgba(255,255,255,0.08);
    --font-d:'Cinzel', Georgia, serif;
    --font-b:'DM Sans', sans-serif;
    --font-m:'JetBrains Mono', monospace;
  }

  html, body, #root { height:100%; overflow:hidden; }
  body { background:var(--bg); color:var(--fg); font-family:var(--font-b); -webkit-font-smoothing:antialiased; }

  body::after {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:9999;
    background-image:repeating-linear-gradient(47deg,rgba(255,255,255,0.012) 0px,transparent 1px,transparent 4px,rgba(255,255,255,0.008) 5px);
    opacity:.5;
  }

  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.12); border-radius:2px; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.2); }

  input, textarea, select, button { font-family:inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="cockpit-icons.jsx"></script>
<script type="text/babel" src="cockpit-sidebar.jsx"></script>
<script type="text/babel" src="campanha-data.jsx"></script>
<script type="text/babel" src="campanha-app.jsx"></script>
<script src="transition-overlay.js"></script>
</body>
</html>
