<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #06070c; font-family: 'DM Sans', sans-serif; padding: 24px; color: #f4efe7; }
  .eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(245,221,177,0.78); margin-bottom: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  .divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 16px 0; }
  .badge { display: inline-flex; align-items: center; justify-content: center; border-radius: 9999px; padding: 2px 10px; font-size: 11px; font-weight: 500; white-space: nowrap; font-family: 'DM Sans', sans-serif; }
  .badge-primary { background: #bc4a3f; color: #fff9f2; border: none; }
  .badge-secondary { background: #1a1821; color: #e6ddd2; border: none; }
  .badge-outline { border: 1px solid rgba(255,255,255,0.15); color: #f4efe7; background: transparent; }
  .badge-red-outline { border: 1px solid rgba(188,74,63,0.2); background: rgba(188,74,63,0.05); color: rgba(188,74,63,0.9); }
  .badge-gold { border: 1px solid rgba(213,162,64,0.2); background: rgba(213,162,64,0.08); color: rgba(245,221,177,0.9); }
  .badge-orange { border: 1px solid rgba(255,165,0,0.2); background: rgba(249,115,22,0.1); color: rgba(251,191,36,0.9); font-weight: 600; }
  .badge-teal { border: 1px solid rgba(75,159,145,0.2); background: rgba(75,159,145,0.1); color: rgba(75,159,145,0.9); }
  .badge-cyan { border: 1px solid rgba(100,200,255,0.35); background: rgba(100,200,255,0.1); color: rgba(165,230,255,0.9); }
  .badge-muted { border: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.35); color: rgba(244,239,231,0.68); font-size: 10px; }
  .meta { font-size: 9px; font-family: monospace; color: rgba(213,162,64,0.5); margin-top: 4px; display: block; }
</style></head><body>

<div class="eyebrow">Variantes Base</div>
<div class="row">
  <span class="badge badge-primary">Primary</span>
  <span class="badge badge-secondary">Secondary</span>
  <span class="badge badge-outline">Outline</span>
  <span class="badge badge-red-outline">Em operação</span>
  <span class="badge badge-gold">Centro</span>
  <span class="badge badge-orange">Hot</span>
  <span class="badge badge-teal">Ativo</span>
</div>

<hr class="divider">

<div class="eyebrow">Contextos de Uso</div>
<div class="row">
  <span class="badge badge-cyan" style="font-size:10px; letter-spacing:0.12em; text-transform:uppercase">Novo</span>
  <span style="font-size:11px; color:rgba(244,239,231,0.7); margin-left:4px">Landing em rework premium</span>
</div>
<div class="row">
  <span class="badge badge-muted">Operação testada para campanhas longas e mesa intensa</span>
</div>
<div class="row">
  <span class="badge badge-red-outline" style="border-radius:6px; font-size:10px; letter-spacing:0.06em; text-transform:uppercase">Master system</span>
</div>
<span class="meta">pill (padrão) · rounded (variante) · contextos de status, notificações e eyebrows</span>

</body></html>
